# Alertas avaliados pelo Prometheus (aparecem em Alerting, no Grafana).
groups:
  - name: projeto-moda
    rules:
      - alert: ApiForaDoAr
        expr: up == 0
        for: 2m
        labels:
          severidade: critica
        annotations:
          resumo: "API de {{ $labels.job }} não responde há 2 minutos"

      - alert: TaxaDeErrosAlta
        expr: |
          sum by (job) (rate(http_requests_total{status="5xx"}[5m]))
            / sum by (job) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severidade: alta
        annotations:
          resumo: "Mais de 5% das requisições de {{ $labels.job }} com erro 5xx"

      - alert: LLMFalhando
        expr: |
          sum by (job) (increase(moda_llm_chamadas_total{resultado="falha"}[15m]))
            / sum by (job) (increase(moda_llm_chamadas_total[15m])) > 0.5
        for: 5m
        labels:
          severidade: media
        annotations:
          resumo: "Mais da metade das chamadas ao LLM falhando em {{ $labels.job }}: o RAG está respondendo pelas regras locais"

      - alert: LLMLento
        expr: |
          histogram_quantile(0.95, sum by (job, le) (rate(moda_llm_latencia_segundos_bucket[15m]))) > 20
        for: 10m
        labels:
          severidade: media
        annotations:
          resumo: "95% das respostas do LLM em {{ $labels.job }} levando mais de 20 s"
