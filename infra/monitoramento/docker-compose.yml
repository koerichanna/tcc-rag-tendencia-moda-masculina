# Prometheus coleta as métricas dos backends de produção e homologação; Grafana mostra os painéis.
# Sobe uma vez na VM:
#   docker network create moda_monitor   (se ainda não existir)
#   docker compose --env-file /opt/projeto-moda/.env.monitoramento up -d

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitor
    mem_limit: 300m

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${MONITOR_DOMAIN}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Visitantes veem os painéis sem login (somente leitura); editar exige o admin.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/projeto-moda.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitor
      - proxy
    mem_limit: 250m

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitor:
    name: moda_monitor
    external: true
  proxy:
    name: moda_proxy
    external: true
