server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Métricas são internas: o Prometheus lê direto do backend pela rede do Docker.
    location = /api/metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A geração de tendências pelo LLM pode levar até 90 s (TEMPO_LIMITE_GERACAO em rag_engine.py);
        # o padrão de 60 s do Nginx cortaria a resposta antes.
        proxy_read_timeout 120s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
