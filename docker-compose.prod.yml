# Usado na VM. Cada ambiente roda como um projeto separado:
#   docker compose -p moda-production --env-file .env.production -f docker-compose.prod.yml up -d
#   docker compose -p moda-staging    --env-file .env.staging    -f docker-compose.prod.yml up -d
# As imagens são publicadas no GHCR pelo pipeline (.github/workflows/ci.yml).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GHCR_OWNER}/projeto-moda-backend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      # frontend e API no mesmo domínio: nenhuma origem externa precisa de CORS
      - CORS_ORIGINS=
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
      - ENVIRONMENT=${APP_ENV}
    volumes:
      - chroma_data:/app/data/chroma_db
    networks:
      default:
      # Rede só de monitoramento (infra/monitoramento). Não usar a rede proxy: lá o frontend
      # dos dois ambientes enxergaria dois serviços chamados "backend".
      monitor:
        aliases:
          - backend-${APP_ENV}

  frontend:
    image: ghcr.io/${GHCR_OWNER}/projeto-moda-frontend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      default:
      proxy:
        aliases:
          - frontend-${APP_ENV}

volumes:
  postgres_data:
  chroma_data:

networks:
  proxy:
    name: moda_proxy
    external: true
  monitor:
    name: moda_monitor
    external: true
