name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # usado pela rotina semanal de dados (atualizar-trends.yml)

permissions:
  contents: read

jobs:
  backend:
    name: Backend - lint e testes
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moda_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/moda_db"
      CHROMA_PERSIST_DIRECTORY: "./data/test_chroma"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Modelo de embedding (~135 MB) baixado do Hugging Face na primeira execução
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-minilm-l12-v2

      - name: Ruff
        run: ruff check .

      - name: Pytest com cobertura
        run: pytest tests/ -v --cov=. --cov-report=term --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  frontend:
    name: Frontend - lint e build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Interface - testes E2E (Playwright)
    needs: [backend, frontend]
    # Versão fixa: o playwright install --with-deps instala pacotes do sistema pelo apt e só conhece
    # versões de Ubuntu já lançadas; o ubuntu-latest passou a apontar para o Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moda_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/moda_db"
      CHROMA_PERSIST_DIRECTORY: "./data/e2e_chroma"
      JWT_SECRET: "segredo-usado-somente-no-ci-e2e"
      CORS_ORIGINS: "http://localhost:4173"
      # cada teste faz login; com o limite de 5 por minuto ligado, os últimos testes receberiam 429
      RATE_LIMIT_ENABLED: "false"
      E2E_URL: "http://localhost:4173"
      E2E_ADMIN: "admin.e2e"
      E2E_SENHA: "senha-do-admin-e2e"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-minilm-l12-v2

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt -r e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Preparar banco, base vetorial e administrador
        run: |
          python ingestion.py
          SENHA_USUARIO="$E2E_SENHA" python criar_usuario.py "$E2E_ADMIN" --admin

      - name: Subir API e frontend
        run: |
          nohup uvicorn main:app --port 8000 > api.log 2>&1 &
          cd frontend && npm ci && VITE_API_URL=http://localhost:8000 npm run build
          nohup npx vite preview --port 4173 --strictPort > ../vite.log 2>&1 &
          for i in $(seq 60); do
            curl -sf http://localhost:8000/health > /dev/null && curl -sf http://localhost:4173 > /dev/null && exit 0
            sleep 2
          done
          cat ../api.log ../vite.log
          exit 1

      - name: Playwright
        run: pytest e2e -v

      - name: Logs da API
        if: failure()
        run: cat api.log || echo "API não chegou a subir (sem api.log)"

  sonarcloud:
    name: Análise estática (SonarCloud)
    needs: backend
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5

  imagens:
    name: Publicar imagens no GHCR
    needs: [backend, frontend, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm  # a VM da Azure é ARM64 (B2pls_v2)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nome do dono em minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER }}/projeto-moda-backend:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.OWNER }}/projeto-moda-frontend:${{ github.sha }}

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'produção' || 'homologação' }})
    needs: imagens
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    # Um grupo só para os dois ambientes: a VM aceita um run-command por vez, e um deploy de
    # homologação simultâneo ao de produção fazia o segundo falhar. Agora o segundo espera.
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Atualizar contêineres na VM
        env:
          AMBIENTE: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          SHA: ${{ github.sha }}
        run: |
          saida=$(az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "cd /opt/projeto-moda/repo && git fetch -q origin && git show $SHA:deploy/deploy.sh | bash -s -- $AMBIENTE $SHA" \
            --query "value[0].message" -o tsv)
          echo "$saida"
          grep -q "concluido" <<< "$saida"
