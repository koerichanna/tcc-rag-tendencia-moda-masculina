# Trocar pelos valores mostrados no SonarCloud ao importar o repositório
sonar.organization=SUA_ORGANIZACAO_SONARCLOUD
sonar.projectKey=SUA_ORGANIZACAO_SONARCLOUD_projeto-moda

sonar.sources=.
sonar.exclusions=tests/**,frontend/node_modules/**,frontend/dist/**,data/**,venv/**,.venv/**,docs/**
sonar.tests=tests
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
